name: charcoal_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
    sdk: ^3.13.2

dependencies:
    flutter:
        sdk: flutter

    cupertino_icons: ^1.0.8
    firebase_core: ^4.15.0
    firebase_auth: ^6.7.0
    cloud_firestore: ^6.10.0
    google_sign_in: ^7.2.0
    geolocator: ^14.0.2
    flutter_map: ^8.2.2
    latlong2: ^0.9.1
    flutter_launcher_icons: ^0.14.4

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^6.0.0

flutter:
    uses-material-design: true

    assets:
        - assets/images/charcoal_icon.png

flutter_launcher_icons:
    android: true
    ios: false
    image_path: "assets/images/charcoal_icon.png"